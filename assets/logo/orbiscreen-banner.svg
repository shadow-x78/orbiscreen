<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="60%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#181c2e"/>
    </linearGradient>

    <!-- Crisp Brand Gradients -->
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#cba6f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Subtle Clean Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.025"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="400" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="16" fill="url(#grid)"/>

  <!-- Clean Border Outline -->
  <rect width="1278" height="398" x="1" y="1" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="1"/>

  <!-- Left: Brand Logo Group (Sharp & Modern, No Blurry Halos) -->
  <g transform="translate(100, 75)">
    <!-- Decorative subtle outer geometric ring -->
    <circle cx="125" cy="125" r="118" fill="none" stroke="#89b4fa" stroke-width="1" opacity="0.15" stroke-dasharray="6 6"/>
    
    <!-- Primary Display Ring -->
    <circle cx="125" cy="125" r="92" fill="none" stroke="url(#brandBlue)" stroke-width="28"/>

    <!-- Extension Screen Dot (The Orbiting Display) -->
    <circle cx="190" cy="190" r="34" fill="url(#brandBlue)"/>
    <circle cx="190" cy="190" r="34" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    
    <!-- Center Dot Indicator -->
    <circle cx="125" cy="125" r="7" fill="#89b4fa" opacity="0.6"/>
  </g>

  <!-- Right: Title, Subtitle, and Feature Pills -->
  <g transform="translate(425, 80)">
    <!-- Main Title -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      ORBI<tspan fill="url(#brandBlue)">SCREEN</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#cdd6f4" letter-spacing="-0.3">
      Turn any Android tablet or phone into a low-latency second monitor for Linux
    </text>

    <!-- Description Details -->
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#a6adc8">
      Open-source Spacedesk &amp; Apple Sidecar alternative · Wayland &amp; X11 · Native Hardware Acceleration
    </text>

    <!-- Feature Pills with High-Quality Vector Icons -->
    <g transform="translate(0, 176)">
      
      <!-- Pill 1: Latency (25ms) -->
      <g transform="translate(0, 0)">
        <rect width="140" height="38" rx="10" fill="#181a27" stroke="#89b4fa" stroke-width="1.2"/>
        <!-- Vector Lightning Icon -->
        <path d="M 23 11 L 15 21 L 20 21 L 17 29 L 26 18 L 21 18 Z" fill="#89b4fa"/>
        <text x="76" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#89b4fa" text-anchor="middle">25ms Latency</text>
      </g>

      <!-- Pill 2: Wayland & X11 -->
      <g transform="translate(150, 0)">
        <rect width="155" height="38" rx="10" fill="#181a27" stroke="#a6e3a1" stroke-width="1.2"/>
        <!-- Vector Monitor Icon -->
        <path d="M 27 12 L 15 12 C 14 12 13 13 13 14 L 13 23 C 13 24 14 25 15 25 L 18 25 L 17 28 L 25 28 L 24 25 L 27 25 C 28 25 29 24 29 23 L 29 14 C 29 13 28 12 27 12 Z M 27 22 L 15 22 L 15 14 L 27 14 Z" fill="#a6e3a1"/>
        <text x="89" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#a6e3a1" text-anchor="middle">Wayland &amp; X11</text>
      </g>

      <!-- Pill 3: Zero Root -->
      <g transform="translate(315, 0)">
        <rect width="130" height="38" rx="10" fill="#181a27" stroke="#cba6f7" stroke-width="1.2"/>
        <!-- Vector Shield Icon -->
        <path d="M 21 11 L 14 14 L 14 19 C 14 23.5 17 27.5 21 28.5 C 25 27.5 28 23.5 28 19 L 28 14 Z M 21 13 L 26 15 L 26 19 C 26 22.5 23.8 25.5 21 26.5 C 18.2 25.5 16 22.5 16 19 L 16 15 Z" fill="#cba6f7"/>
        <text x="76" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#cba6f7" text-anchor="middle">Zero Root</text>
      </g>

      <!-- Pill 4: Stylus & Touch -->
      <g transform="translate(455, 0)">
        <rect width="155" height="38" rx="10" fill="#181a27" stroke="#f9e2af" stroke-width="1.2"/>
        <!-- Vector Stylus Pen Icon -->
        <path d="M 15 23.5 L 15 27 L 18.5 27 L 27.2 18.3 L 23.7 14.8 Z M 29.5 16 C 29.8 15.7 29.8 15.2 29.5 14.9 L 27.1 12.5 C 26.8 12.2 26.3 12.2 26 12.5 L 24.6 13.9 L 28.1 17.4 Z" fill="#f9e2af"/>
        <text x="89" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#f9e2af" text-anchor="middle">Stylus &amp; Touch</text>
      </g>

      <!-- Pill 5: 100% Rust -->
      <g transform="translate(620, 0)">
        <rect width="135" height="38" rx="10" fill="#181a27" stroke="#fab387" stroke-width="1.2"/>
        <!-- Vector Gear / Tech Icon -->
        <path d="M 25 18 C 24.8 17.5 24.5 17.1 24.2 16.7 L 24.8 15.3 C 25 14.8 24.8 14.3 24.4 14.1 L 22.9 13.2 C 22.5 13 22 13.1 21.7 13.5 L 20.8 14.6 C 20.3 14.4 19.8 14.3 19.2 14.2 L 19 12.7 C 18.9 12.2 18.5 11.9 18 11.9 L 16.3 11.9 C 15.8 11.9 15.4 12.2 15.3 12.7 L 15.1 14.2 C 14.5 14.3 14 14.4 13.5 14.6 L 12.6 13.5 C 12.3 13.1 11.8 13 11.4 13.2 L 9.9 14.1 C 9.5 14.3 9.3 14.8 9.5 15.3 L 10.1 16.7 C 9.8 17.1 9.5 17.5 9.3 18 L 7.8 18.2 C 7.3 18.3 7 18.7 7 19.2 L 7 20.9 C 7 21.4 7.3 21.8 7.8 21.9 L 9.3 22.1 C 9.5 22.6 9.8 23 10.1 23.4 L 9.5 24.8 C 9.3 25.3 9.5 25.8 9.9 26 L 11.4 26.9 C 11.8 27.1 12.3 27 12.6 26.6 L 13.5 25.5 C 14 25.7 14.5 25.8 15.1 25.9 L 15.3 27.4 C 15.4 27.9 15.8 28.2 16.3 28.2 L 18 28.2 C 18.5 28.2 18.9 27.9 19 27.4 L 19.2 25.9 C 19.8 25.8 20.3 25.7 20.8 25.5 L 21.7 26.6 C 22 27 22.5 27.1 22.9 26.9 L 24.4 26 C 24.8 25.8 25 25.3 24.8 24.8 L 24.2 23.4 C 24.5 23 24.8 22.6 25 22.1 L 26.5 21.9 C 27 21.8 27.3 21.4 27.3 20.9 L 27.3 19.2 C 27.3 18.7 27 18.3 26.5 18.2 Z M 17.1 22.5 C 15.8 22.5 14.7 21.4 14.7 20.1 C 14.7 18.8 15.8 17.7 17.1 17.7 C 18.4 17.7 19.5 18.8 19.5 20.1 C 19.5 21.4 18.4 22.5 17.1 22.5 Z" fill="#fab387"/>
        <text x="80" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#fab387" text-anchor="middle">100% Rust</text>
      </g>

    </g>
  </g>
</svg>
