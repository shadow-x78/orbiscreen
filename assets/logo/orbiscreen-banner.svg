<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="60%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#181c2e"/>
    </linearGradient>

    <!-- Crisp Brand Gradients -->
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#cba6f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Subtle Clean Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.025"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="400" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="16" fill="url(#grid)"/>

  <!-- Clean Border Outline -->
  <rect width="1278" height="398" x="1" y="1" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="1"/>

  <!-- Left: Brand Logo Group -->
  <g transform="translate(100, 75)">
    <!-- Decorative outer ring -->
    <circle cx="125" cy="125" r="118" fill="none" stroke="#89b4fa" stroke-width="1" opacity="0.15" stroke-dasharray="6 6"/>

    <!-- Primary Display Ring -->
    <circle cx="125" cy="125" r="92" fill="none" stroke="url(#brandBlue)" stroke-width="28"/>

    <!-- Extension Screen Dot (The Orbiting Display) -->
    <circle cx="190" cy="190" r="34" fill="url(#brandBlue)"/>
    <circle cx="190" cy="190" r="34" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Right: Title, Subtitle, and Feature Pills -->
  <g transform="translate(425, 80)">
    <!-- Main Title -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      ORBI<tspan fill="url(#brandBlue)">SCREEN</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#cdd6f4" letter-spacing="-0.3">
      Turn any Android tablet or phone into a second monitor for Linux
    </text>

    <!-- Description Details -->
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#a6adc8">
      Open-source · Wayland &amp; X11 · Low-latency · Stylus &amp; Touch
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 176)">

      <!-- Pill 1: Latency (25ms) -->
      <g transform="translate(0, 0)">
        <rect width="148" height="38" rx="10" fill="#181a27" stroke="#89b4fa" stroke-width="1.2"/>
        <!-- Lightning Icon -->
        <path d="M 23 11 L 15 21 L 20 21 L 17 29 L 26 18 L 21 18 Z" fill="#89b4fa"/>
        <text x="80" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#89b4fa" text-anchor="middle">25ms Latency</text>
      </g>

      <!-- Pill 2: Wayland & X11 -->
      <g transform="translate(162, 0)">
        <rect width="160" height="38" rx="10" fill="#181a27" stroke="#a6e3a1" stroke-width="1.2"/>
        <!-- Monitor Icon -->
        <path d="M 27 12 L 15 12 C 14 12 13 13 13 14 L 13 23 C 13 24 14 25 15 25 L 18 25 L 17 28 L 25 28 L 24 25 L 27 25 C 28 25 29 24 29 23 L 29 14 C 29 13 28 12 27 12 Z M 27 22 L 15 22 L 15 14 L 27 14 Z" fill="#a6e3a1"/>
        <text x="92" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#a6e3a1" text-anchor="middle">Wayland &amp; X11</text>
      </g>

      <!-- Pill 3: Stylus & Touch -->
      <g transform="translate(336, 0)">
        <rect width="160" height="38" rx="10" fill="#181a27" stroke="#f9e2af" stroke-width="1.2"/>
        <!-- Stylus Pen Icon -->
        <path d="M 15 23.5 L 15 27 L 18.5 27 L 27.2 18.3 L 23.7 14.8 Z M 29.5 16 C 29.8 15.7 29.8 15.2 29.5 14.9 L 27.1 12.5 C 26.8 12.2 26.3 12.2 26 12.5 L 24.6 13.9 L 28.1 17.4 Z" fill="#f9e2af"/>
        <text x="92" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#f9e2af" text-anchor="middle">Stylus &amp; Touch</text>
      </g>

    </g>
  </g>
</svg>
