<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ─────────────────────────────────────────────
       Orbiscreen - Project Logo
       ─────────────────────────────────────────────
       The frame, but whole - a display bezel ring
       (the Linux host screen) with the three
       transport dots riding its edge (Wi-Fi, USB,
       the browser client - the Orbiscreen
       triangle), and the double chevron (the
       stream signal advancing, screen after
       screen) as the hero in the center. Same
       flat single-color language as the UMO mark.
       One color, two role classes (.orbi-f fill,
       .orbi-s stroke). Square content box, dead
       centered on the 512 canvas.
       ───────────────────────────────────────────── -->
  <defs>
    <style>.orbi-f{fill:#89b4fa;}.orbi-s{fill:none;stroke:#89b4fa;}</style>
  </defs>
  <rect class="orbi-s" x="80" y="80" width="352" height="376" rx="76" stroke-width="32"/>
  <circle class="orbi-f" cx="256" cy="80" r="40"/>
  <circle class="orbi-f" cx="432" cy="348" r="40"/>
  <circle class="orbi-f" cx="80" cy="348" r="40"/>
  <path class="orbi-s" d="M 178 178 L 256 256 L 178 334" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="orbi-s" d="M 288 178 L 366 256 L 288 334" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
