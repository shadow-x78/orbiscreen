# ─────────────────────────────────────────────
# Orbiscreen - Packit Configuration (COPR)
# https://github.com/shadow-x78/orbiscreen
# ─────────────────────────────────────────────

# ── Source ──
# The COPR spec builds from the release tarball with cargo (source-build);
# the local scripts keep using data/orbiscreen.spec against prebuilt binaries.
specfile_path: data/orbiscreen-copr.spec
files_to_sync:
  - data/orbiscreen-copr.spec
  - .packit.yaml

upstream_package_name: orbiscreen
downstream_package_name: orbiscreen

# ── RPM Environment ──
# COPR builders are offline during %build, so the SRPM must carry the crate
# tree as Source1. This action regenerates the vendored tarball and copies
# it next to the spec right before Packit assembles the SRPM.
srpm_build_deps:
  - cargo
  - git-core
  - zstd

actions:
  create-archive: |
    VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*\"\(.*\)\".*/\1/')"
    cargo vendor vendor >/dev/null 2>&1
    tar --use-compress-program="zstd -19 -T0" -cf "orbiscreen-vendor-${VERSION}.tar.zst" vendor
    cp "orbiscreen-vendor-${VERSION}.tar.zst" "$(git rev-parse --show-toplevel)/data/"
    echo "orbiscreen-vendor-${VERSION}.tar.zst"
  get-current-version: grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/'

# ── Jobs ──
# PR builds verify the spec compiles on current stable Fedora.
# Release (tag) builds publish to the COPR repository.
jobs:
  - job: copr_build
    trigger: pull_request
    targets:
      - fedora-stable
    owner: shadow-x78
    project: orbiscreen

  - job: copr_build
    trigger: release
    targets:
      - fedora-stable
    owner: shadow-x78
    project: orbiscreen
