# ─────────────────────────────────────────────
# Orbiscreen - orbiscreen-transport Crate Manifest 
# ─────────────────────────────────────────────

[package]
name = "orbiscreen-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP MPEG-TS, UDP Annex-B, and WebTransport Annex-B streaming with token auth and mDNS host discovery"

[lints]
workspace = true

[dependencies]

mdns-sd = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tower-http = { workspace = true }
hostname = { workspace = true }
orbiscreen-input = { path = "../orbiscreen-input" }
orbiscreen-core = { path = "../orbiscreen-core" }
x509-parser = "0.18"
libc = { workspace = true }
tokio-stream = { workspace = true }
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = "0.10"
wtransport = { version = "0.7.2", features = ["self-signed"] }
# ── Quinn Dependency Pin ──
quinn-proto = "=0.11.16"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"

[package.metadata.cargo-machete]
ignored = ["quinn-proto"]

[dev-dependencies]
orbiscreen-encode = { path = "../orbiscreen-encode" }
