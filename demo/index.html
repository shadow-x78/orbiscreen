<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbiscreen demo</title>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../site/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 720px;
    height: 720px;
    overflow: hidden;
    background: #000;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.6s ease;
    padding: 60px;
    text-align: center;
  }

  .scene.active { opacity: 1; }

  .title {
    font-size: 48px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
  }

  .subtitle {
    font-size: 20px;
    font-weight: 400;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.7);
    max-width: 480px;
  }

  .accent { color: #60a5fa; }

  .device {
    width: 240px;
    height: 160px;
    background: #111;
    border: 2px solid #333;
    border-radius: 8px;
    margin: 30px auto;
    position: relative;
    overflow: hidden;
  }

  .device.tablet {
    width: 180px;
    height: 240px;
  }

  .screen {
    position: absolute;
    inset: 12px;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.5);
  }

  .connection {
    width: 60px;
    height: 2px;
    background: #60a5fa;
    margin: 0 auto;
    position: relative;
  }

  .connection::before,
  .connection::after {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    background: #60a5fa;
    border-radius: 50%;
    top: -3px;
  }

  .connection::before { left: -4px; }
  .connection::after { right: -4px; }

  .footer {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: rgba(255, 255, 255, 0.4);
  }

  .logo {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>

<!-- Scene 0: Intro -->
<div class="scene active" id="s0">
  <div class="title">
    Orbiscreen
  </div>
  <div class="subtitle">
    Your tablet is a <span class="accent">second monitor</span>
  </div>
</div>

<!-- Scene 1: Extended Display -->
<div class="scene" id="s1">
  <div class="title">
    Extended display
  </div>
  <div style="display: flex; gap: 20px; align-items: center; margin: 30px 0;">
    <div class="device">
      <div class="screen">Linux</div>
    </div>
    <div class="connection"></div>
    <div class="device tablet">
      <div class="screen">Android</div>
    </div>
  </div>
  <div class="subtitle">
    Real second screen over LAN or USB
  </div>
</div>

<!-- Scene 2: Features -->
<div class="scene" id="s2">
  <div class="title">
    <span class="accent">H.264</span> video<br>
    <span class="accent">Touch & Pen</span> input
  </div>
  <div class="subtitle" style="margin-top: 30px;">
    Low latency • Rootless • Open source
  </div>
</div>

<!-- Scene 3: End -->
<div class="scene" id="s3">
  <div class="logo">Orbiscreen</div>
  <div class="subtitle" style="margin-top: 20px;">
    github.com/shadow-x78/orbiscreen
  </div>
</div>

<div class="footer" id="timecode">0.0s</div>

<script>
const TOTAL = 24.0;  // 24 seconds total
const scenes = [
  { start: 0,    end: 6,   el: document.getElementById('s0') },
  { start: 6,    end: 12,  el: document.getElementById('s1') },
  { start: 12,   end: 18,  el: document.getElementById('s2') },
  { start: 18,   end: 24,  el: document.getElementById('s3') }
];

let time = 0;
const timecode = document.getElementById('timecode');
const urlParams = new URLSearchParams(window.location.search);
const captureMode = urlParams.get('capture') === '1';
const startTime = parseFloat(urlParams.get('t')) || 0;

function setTime(t) {
  time = t;
  scenes.forEach(s => {
    s.el.classList.toggle('active', t >= s.start && t < s.end);
  });
  timecode.textContent = t.toFixed(1) + 's';
}

function animate() {
  if (captureMode) return;
  const elapsed = (performance.now() - startFrame) / 1000;
  setTime(elapsed % TOTAL);
  requestAnimationFrame(animate);
}

window.__setTime = setTime;
window.__total = TOTAL;

if (startTime > 0) {
  setTime(startTime);
} else {
  const startFrame = performance.now();
  animate();
}
</script>
</body>
</html>
