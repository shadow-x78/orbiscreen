# ─────────────────────────────────────────────
# Orbiscreen - Cargo Deny Configuration
# https://github.com/shadow-x78/orbiscreen
# ─────────────────────────────────────────────

# ── Licenses ──
[licenses]
allow = [
    "GPL-3.0",
    "GPL-3.0-or-later",
    "LGPL-2.1",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]

# ── Graph ──
[graph]
all-features = false

# ── Advisories ──
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  "RUSTSEC-2024-0388",
]

# ── Bans ──
[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
