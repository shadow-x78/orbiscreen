<!doctype html>
<!-- Orbiscreen - Web Client (GPL-3.0-or-later) https://github.com/shadow-x78/orbiscreen -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' 'unsafe-inline'; media-src 'self' blob: data:" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#11111b" />
    <title>Orbiscreen</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    
    <header id="controlToolbar" class="controlToolbar hidden">
        <div class="toolbarHost">
            <span class="activeDot"></span>
            <div class="hostDetails">
                <span id="hostName" class="hostName">Orbiscreen</span>
                <span id="hostInfo" class="hostInfo">1920×1080  NVENC</span>
            </div>
        </div>

        <div class="toolbarActions">
            
            <button id="btnInputMode" class="actionBtn" title="Toggle Input Mode (Touch / Mouse)">
                <svg id="iconMouse" class="svgIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M13 1.07V9h7c0-4.08-3.05-7.44-7-7.93zM4 15c0 4.42 3.58 8 8 8s8-3.58 8-8v-4H4v4zm7-13.93C7.05 1.56 4 4.92 4 9h7V1.07z"/>
                </svg>
                <svg id="iconTouch" class="svgIcon hidden" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.02-.24-.02-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.43 1.06.43h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.01-.14.01-.2 0-.62-.38-1.16-.9-1.38z"/>
                </svg>
            </button>

            <button id="btnKeyboard" class="actionBtn" title="On-Screen Virtual Keyboard">
                <svg class="svgIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/>
                </svg>
            </button>

            <button id="btnLock" class="actionBtn" title="Lock Linux Session">
                <svg class="svgIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
            </button>

            <button id="btnSettings" class="actionBtn" title="Settings & Display Stats">
                <svg class="svgIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>

            <button id="btnHideControls" class="actionBtn" title="Hide Toolbar">
                <svg class="svgIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78 3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                </svg>
            </button>

            <button id="btnFullscreen" class="actionBtn" title="Toggle Fullscreen">
                <svg class="svgIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>

            <button id="btnDisconnect" class="actionBtn btnDanger" title="Disconnect">
                <svg class="svgIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
    </header>

    <div id="miniPill" class="miniPill hidden">
        <span class="activeDotSmall"></span>
        <span id="miniInfo" class="miniInfo">1920×1080</span>
        <button id="btnRestoreToolbar" class="miniBtn" title="Restore Toolbar">
            <svg class="svgIconSmall" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
        </button>
    </div>

    <div id="keyboardDrawer" class="keyboardDrawer hidden">
        
        <input type="text" id="keyboardImeInput" class="keyboardImeInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

        <div class="keyboardKeysRow">
            <button class="keyBtn" data-code="Escape">Esc</button>
            <button class="keyBtn" data-code="Tab">Tab</button>
            <button class="keyBtn" data-code="F1">F1</button>
            <button class="keyBtn" data-code="F2">F2</button>
            <button class="keyBtn" data-code="F5">F5</button>
            <button class="keyBtn" data-code="F11">F11</button>
            <button class="keyBtn" data-code="F12">F12</button>
            <button class="keyBtn btnBackspace" data-code="Backspace">⌫</button>
            <button id="btnCloseKeyboard" class="keyBtn btnCloseKey" title="Close Keyboard">
                <svg class="svgIconSmall" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>

        <div class="keyboardKeysRow">
            <button class="keyBtn keyToggle" data-latch="ControlLeft" data-raw="29">Ctrl</button>
            <button class="keyBtn keyToggle" data-latch="AltLeft" data-raw="56">Alt</button>
            <button class="keyBtn keyToggle" data-latch="ShiftLeft" data-raw="42">Shift</button>
            <button class="keyBtn keyToggle" data-latch="MetaLeft" data-raw="125">Win</button>
            <button class="keyBtn keyAction" data-action="undo">Undo</button>
            <button class="keyBtn keyAction" data-action="copy">Copy</button>
            <button class="keyBtn keyAction" data-action="paste">Paste</button>
            <button class="keyBtn" data-code="Delete">Del</button>
            <button class="keyBtn keyPrimary" data-code="Enter">↵</button>
        </div>

        <div class="keyboardKeysRow">
            <button class="keyBtn" data-code="Home">Home</button>
            <button class="keyBtn" data-code="End">End</button>
            <button class="keyBtn" data-code="PageUp">PgUp</button>
            <button class="keyBtn" data-code="PageDown">PgDn</button>
            <button class="keyBtn keySpace" data-code="Space">Space</button>
            <button class="keyBtn" data-code="ArrowLeft">←</button>
            <button class="keyBtn" data-code="ArrowUp">↑</button>
            <button class="keyBtn" data-code="ArrowDown">↓</button>
            <button class="keyBtn" data-code="ArrowRight">→</button>
            <button class="keyBtn keySpecial" id="btnSendCad">CAD</button>
        </div>
    </div>

    <div id="settingsModal" class="settingsModal hidden">
        <div class="settingsCard">
            <div class="settingsHeader">
                <h2>Display Settings</h2>
                <button id="btnCloseSettings" class="iconCloseBtn">
                    <svg class="svgIconSmall" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            <div class="settingsGroup">
                <label>Screen Fit Mode</label>
                <div class="chipsRow">
                    <button class="chipBtn active" data-fit="contain">Fit to Screen</button>
                    <button class="chipBtn" data-fit="cover">Fill (Stretch)</button>
                    <button class="chipBtn" data-fit="none">100% Original</button>
                </div>
            </div>
            <div class="settingsGroup">
                <label>Performance Stats</label>
                <div class="statsGrid">
                    <div class="statItem">
                        <span class="statLabel">Latency</span>
                        <span id="statLatency" class="statValue">-- ms</span>
                    </div>
                    <div class="statItem">
                        <span class="statLabel">Resolution</span>
                        <span id="statRes" class="statValue">1920 × 1080</span>
                    </div>
                    <div class="statItem">
                        <span class="statLabel">Encoder</span>
                        <span id="statEncoder" class="statValue">NVENC</span>
                    </div>
                </div>
            </div>
            <div class="settingsGroup">
                <label>Host Actions</label>
                <div class="chipsRow">
                    <button id="btnActionBlank" class="chipBtn">Toggle Display Power</button>
                    <button id="btnActionResync" class="chipBtn">Resync Stream</button>
                </div>
            </div>
        </div>
    </div>

    <div id="vncBanner" class="vncBanner hidden">
        <span>Control Active · Press <kbd>Esc</kbd> to release cursor</span>
    </div>

    <div id="toast" class="toast hidden"></div>

    <div id="stage" class="stage" tabindex="0">
        <video id="remoteVideo" autoplay playsinline muted></video>

        <div id="overlay" class="overlay">
            <div class="loadingContainer">
                <svg id="brandLogo" class="brandLogo hidden" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="256" cy="256" r="170" stroke="#89B4FA" stroke-width="54"/>
                    <circle cx="376" cy="376" r="62" fill="#74C7EC"/>
                </svg>
                <div id="statusSpinner" class="androidSpinner"></div>
                <div id="statusIcon" class="statusIconContainer hidden">
                    <svg class="svgIconLarge" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.99 9C21.46 7.54 19.38 6.5 17 6.13L19.88 9h3.11zM12 4c-3.17 0-6.07 1.12-8.36 3l1.45 1.45C6.91 7.08 9.32 6.2 12 6.2c3.15 0 5.99 1.22 8.11 3.22L21.57 8C19.14 5.56 15.77 4 12 4zM1.39 4.22l2.28 2.28C2.12 7.5 1.05 8.7 1 8.75l10.99 13.7 3.32-4.14 4.47 4.47 1.41-1.41L1.39 4.22zM12 18.25L4.47 8.86C5.46 8.14 6.64 7.6 7.9 7.32l8.81 8.81-4.71 5.87v-3.75z"/>
                    </svg>
                </div>
                <h3 id="statusTitle" class="statusTitle">Connecting</h3>
                <p id="statusSubtitle" class="statusSubtitle">Connecting to Linux virtual display&hellip;</p>
                <div id="tokenRow" class="tokenRow hidden">
                    <input type="text" id="tokenInput" placeholder="Session access token..." />
                    <button id="btnConnect">Connect</button>
                </div>
                <button id="btnReconnect" class="btnReconnect hidden">
                    <svg class="svgIconSmall" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    <span>Reconnect</span>
                </button>
            </div>
        </div>
    </div>

    <div id="touchIndicator" class="touchIndicator hidden"></div>

    <script src="vendor/mpegts.js"></script>
    <script src="app.js"></script>
</body>
</html>
