<!doctype html>
<!-- ─────────────────────────────────────────────
     Orbiscreen - Web Client (GPL-3.0-or-later)
     https://github.com/shadow-x78/orbiscreen
     ───────────────────────────────────────────── -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; media-src 'self' blob:" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Orbiscreen Client</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="stage" class="stage">
        <video id="remoteVideo" autoplay playsinline muted></video>
        <div id="overlay" class="overlay">
            <div class="card">
                <h1>Orbiscreen</h1>
                <p class="muted" id="status">Connecting&hellip;</p>
                <p id="resolution" class="muted small"></p>
                <p id="controlHint" class="muted small">Click to control</p>
            </div>
        </div>
    </div>
    <div id="touchIndicator" class="touchIndicator hidden"></div>
    <script src="vendor/mpegts.js"></script>
    <script src="app.js"></script>
</body>
</html>
