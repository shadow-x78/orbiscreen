# ─────────────────────────────────────────────
# Orbiscreen - IndexNow submission
# https://github.com/shadow-x78/orbiscreen
# ─────────────────────────────────────────────
# Google retired the sitemap ping endpoint, and adding the Search Console
# property is a one-time dashboard step. IndexNow is the remaining push channel
# that needs nothing but a key file on the domain: Bing, Yandex, Seznam and Naver
# read it.
#
# The key in site/public/<key>.txt is public by design; it only proves control of
# the host. The workflow waits for the key to answer on the live site, then posts
# the sitemap URLs. A rejection is reported as a warning rather than failing the
# run, because indexing must never block a release.

name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    name: Submit the sitemap to IndexNow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The deployment runs in parallel with this workflow, and IndexNow rejects
      # a key that is not reachable yet.
      - name: Wait for the key file
        run: |
          key="$(basename "$(ls site/public/*.txt | head -1)" .txt)"
          url="https://orbiscreen.com/${key}.txt"
          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ]; then
              echo "key file is live"
              exit 0
            fi
            echo "attempt ${attempt}: key file not live yet"
            sleep 20
          done
          echo "::warning::key file never became reachable; skipping this submission"
          exit 0

      - name: Submit URLs
        run: |
          key="$(basename "$(ls site/public/*.txt | head -1)" .txt)"
          python3 - "$key" <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          key = sys.argv[1]
          host = "orbiscreen.com"

          sitemap = urllib.request.urlopen(f"https://{host}/sitemap.xml", timeout=60).read().decode()
          urls = [part.split("</loc>")[0].replace("<loc>", "") for part in sitemap.split("<loc>")[1:]]
          if not urls:
              print("::warning::sitemap contained no URLs; nothing to submit")
              raise SystemExit(0)

          payload = json.dumps(
              {
                  "host": host,
                  "key": key,
                  "keyLocation": f"https://{host}/{key}.txt",
                  "urlList": urls,
              }
          ).encode()

          status = None
          for attempt in range(1, 5):
              request = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=payload,
                  headers={"Content-Type": "application/json; charset=utf-8"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      status = response.status
                  break
              except urllib.error.HTTPError as error:
                  status = error.code
                  # 403 right after a deploy is the key not being visible yet;
                  # retrying covers it. 422 means the URL list is wrong and no
                  # retry will help.
                  if error.code == 422:
                      break
                  time.sleep(5 * attempt)
              except Exception as error:  # network hiccup
                  status = str(error)
                  time.sleep(5 * attempt)

          if isinstance(status, int) and status < 400:
              print(f"IndexNow accepted {len(urls)} URLs (HTTP {status})")
          else:
              print(f"::warning::IndexNow rejected the submission (status {status})")
          PY
