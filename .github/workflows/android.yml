# ─────────────────────────────────────────────
# Orbiscreen - Android Workflow 
# ─────────────────────────────────────────────

name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:
  android:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Prepare signing keystore
        env:
          ORBISCREEN_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ORBISCREEN_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORBISCREEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBISCREEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ORBISCREEN_KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is not set in the repository"
            exit 1
          fi
          if [ -z "${ORBISCREEN_STORE_PASSWORD:-}" ] || [ -z "${ORBISCREEN_KEY_ALIAS:-}" ] || [ -z "${ORBISCREEN_KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets are empty"
            exit 1
          fi
          echo "$ORBISCREEN_KEYSTORE_B64" | base64 -d > /tmp/orbiscreen-release.keystore
          keytool -list -keystore /tmp/orbiscreen-release.keystore \
            -storepass "$ORBISCREEN_STORE_PASSWORD" >/dev/null
          keytool -list -keystore /tmp/orbiscreen-release.keystore \
            -storepass "$ORBISCREEN_STORE_PASSWORD" \
            -alias "$ORBISCREEN_KEY_ALIAS" >/dev/null
      - name: Build
        env:
          ORBISCREEN_KEYSTORE_PATH: /tmp/orbiscreen-release.keystore
          ORBISCREEN_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORBISCREEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBISCREEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::assembleRelease produced an unsigned APK; signing configuration is broken"
            exit 1
          fi
      - name: Remove keystore
        if: always()
        run: rm -f /tmp/orbiscreen-release.keystore
      - name: Upload APK
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: orbiscreen-android-release
          path: clients/android/app/build/outputs/apk/release/*.apk
