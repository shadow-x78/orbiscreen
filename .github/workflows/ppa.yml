# ─────────────────────────────────────────────
# Orbiscreen - Launchpad PPA Publish Workflow
# https://github.com/shadow-x78/orbiscreen
# ─────────────────────────────────────────────

# ── Triggers ──
name: Publish to Launchpad PPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      series:
        description: 'Ubuntu series (e.g. noble for 24.04, oracular for 24.10)'
        required: true
        default: 'noble'
        type: choice
        options:
          - noble
          - oracular

concurrency:
  group: ppa-${{ github.event.inputs.series || 'noble' }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload-ppa:
    name: Build & Upload Source Package to PPA
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:

      # ── Toolchain ──
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # ── Build & Packaging Dependencies ──
      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dput dpkg-dev pkg-config \
            libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            libevdev-dev libxkbcommon-dev \
            qt6-base-dev qt6-wayland cmake g++

      # ── Pre-Upload Verification ──
      - name: Verify source build before upload
        run: |
          cargo build --release --workspace --locked
          cargo test --workspace --locked
          cmake -S gui -B build-gui -DCMAKE_BUILD_TYPE=Release
          cmake --build build-gui -j"$(nproc)"
          ctest --test-dir build-gui --output-on-failure

      # ── Offline Build ──
      - name: Vendor Cargo dependencies
        run: |
          cargo vendor vendor/
          mkdir -p .cargo
          cat << 'CFG' > .cargo/config.toml
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "vendor"
          CFG

      # ── Release Signing ──
      - name: Configure GPG key for signing
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          GPG_KEY="$PPA_GPG_KEY"
          if [ -z "$GPG_KEY" ]; then
            echo "::error::PPA_GPG_KEY is not set. Launchpad only accepts uploads signed by a key registered to the PPA owner; the RPM key is not accepted."
            exit 1
          fi
          KEYRING_FILE="$(mktemp)"
          chmod 600 "$KEYRING_FILE"
          if printf '%s' "$GPG_KEY" | base64 -d > "$KEYRING_FILE" 2>/dev/null \
             && grep -q 'BEGIN PGP PRIVATE KEY BLOCK' "$KEYRING_FILE"; then
            :
          elif printf '%s' "$GPG_KEY" > "$KEYRING_FILE" && grep -q 'BEGIN PGP PRIVATE KEY BLOCK' "$KEYRING_FILE"; then
            :
          else
            echo "::error::The PPA key is neither a base64-encoded nor an armored private key"
            rm -f "$KEYRING_FILE"
            exit 1
          fi
          gpg --batch --import "$KEYRING_FILE"
          rm -f "$KEYRING_FILE"
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '$1=="sec"{print $5; exit}')
          if [ -z "$GPG_KEY_ID" ]; then
            echo "::error::No secret key found after importing GPG_KEY"
            exit 1
          fi
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          if [ -n "${PPA_GPG_PASSPHRASE:-}" ]; then
            PASS_FILE="$RUNNER_TEMP/ppa-passphrase"
            umask 077
            printf '%s' "$PPA_GPG_PASSPHRASE" > "$PASS_FILE"
            echo "GPG_OPTS=--batch --pinentry-mode loopback --passphrase-file $PASS_FILE" >> "$GITHUB_ENV"
          else
            echo "GPG_OPTS=--batch --pinentry-mode loopback" >> "$GITHUB_ENV"
          fi

      # ── Distribution Metadata ──
      - name: Prepare debian/changelog for target series
        env:
          SERIES_INPUT: ${{ github.event.inputs.series || 'noble' }}
        run: |
          SERIES="$SERIES_INPUT"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "main" ] || [ -z "$VERSION" ]; then
            VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cat << CHLOG > debian/changelog
          orbiscreen (${VERSION}~ubuntu${SERIES}1) ${SERIES}; urgency=medium

            * Release ${VERSION} for Ubuntu ${SERIES}.

           -- shadow-x7 <shadow-x7@red-shadows-rs.com>  $(date -R)
          CHLOG

      - name: Check if Launchpad already published this version
        id: published
        run: |
          if python3 scripts/check-ppa-published.py "$VERSION"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Launchpad already has ${VERSION}."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Source Package ──
      - name: Build Debian Source Package
        if: steps.published.outputs.already != 'true'
        run: |
          debuild --no-lintian -S -sa -d -k"${GPG_KEY_ID}" -p"gpg ${GPG_OPTS}"
          rm -f "$RUNNER_TEMP/ppa-passphrase" 2>/dev/null || true

      # ── Upload Transport ──
      - name: Configure dput
        if: steps.published.outputs.already != 'true'
        run: |
          cat << 'EOF' > ~/.dput.cf
          [DEFAULT]
          passive_ftp = 1

          [orbiscreen-ppa]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~shadow-x78/ubuntu/ppa/
          login = anonymous
          passive_ftp = 1
          EOF

      # ── Publish ──
      - name: Upload to Launchpad PPA via dput
        if: steps.published.outputs.already != 'true'
        run: |
          CHANGES_FILE=$(ls ../orbiscreen_*_source.changes | tail -n 1)
          echo "Uploading $CHANGES_FILE to Launchpad PPA..."
          for attempt in 1 2 3 4; do
            echo "Attempt $attempt: uploading to Launchpad PPA..."
            if dput -u -P -f orbiscreen-ppa "$CHANGES_FILE" || dput -u -P -f ppa:shadow-x78/ppa "$CHANGES_FILE"; then
              echo "Upload successfully completed."
              exit 0
            fi
            echo "Attempt $attempt failed. Waiting 15s before retry..."
            sleep 15
          done
          echo "::error::Failed to upload to Launchpad PPA after multiple attempts."
          exit 1

      - name: Verify Launchpad published the upload
        run: |
          for attempt in $(seq 1 30); do
            if python3 scripts/check-ppa-published.py "$VERSION"; then
              echo "Launchpad published ${VERSION}."
              exit 0
            fi
            echo "Waiting for Launchpad to publish ${VERSION} (attempt ${attempt}/30)..."
            sleep 20
          done
          echo "::error::Launchpad accepted the upload but did not publish ${VERSION}. Check that PPA_GPG_KEY is registered on Launchpad and review the rejection email."
          exit 1

