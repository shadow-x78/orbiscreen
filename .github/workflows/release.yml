name: Release Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: Build & Package Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb1-dev libxrandr-dev \
            libevdev-dev libxkbcommon-dev libwayland-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libgtk-4-dev libadwaita-1-dev libgraphene-1.0-dev rpm

      - name: Build release binaries
        run: |
          cargo build --release --workspace

      - name: Package Linux tarball
        run: |
          mkdir -p release-bundle/bin
          cp target/release/orbiscreen release-bundle/bin/
          cp scripts/install.sh release-bundle/
          tar -czvf orbiscreen-linux-x86_64.tar.gz -C release-bundle .

      - name: Package Debian DEB package
        run: |
          chmod +x scripts/package-deb.sh
          VERSION=${GITHUB_REF_NAME#v}
          ./scripts/package-deb.sh $VERSION
          mv orbiscreen_${VERSION}_amd64.deb orbiscreen_amd64.deb

      - name: Package RPM package
        run: |
          chmod +x scripts/package-rpm.sh
          VERSION=${GITHUB_REF_NAME#v}
          ./scripts/package-rpm.sh $VERSION
          mv orbiscreen-${VERSION}-1.x86_64.rpm orbiscreen_x86_64.rpm

      - name: Package AppImage
        run: |
          chmod +x scripts/package-appimage.sh
          VERSION=${GITHUB_REF_NAME#v}
          ./scripts/package-appimage.sh $VERSION
          tar -czvf orbiscreen-x86_64.AppImage.tar.gz -C target/AppDir .

      - name: Set up JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android Release APK
        run: |
          cd clients/android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../orbiscreen-android-release.apk

      - name: Generate SHA256 sums
        run: |
          sha256sum orbiscreen-linux-x86_64.tar.gz > orbiscreen-linux-x86_64.tar.gz.sha256
          sha256sum orbiscreen_amd64.deb > orbiscreen_amd64.deb.sha256
          sha256sum orbiscreen_x86_64.rpm > orbiscreen_x86_64.rpm.sha256
          sha256sum orbiscreen-x86_64.AppImage.tar.gz > orbiscreen-x86_64.AppImage.tar.gz.sha256
          sha256sum orbiscreen-android-release.apk > orbiscreen-android-release.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Orbiscreen ${{ github.ref_name }}
          body: |
            ## Orbiscreen ${{ github.ref_name }}
            
            Please see the [CHANGELOG.md](https://github.com/shadow-x78/orbiscreen/blob/main/CHANGELOG.md) for full release notes.
            
            ### Installation Instructions
            Please refer to the [Installation Guide](https://github.com/shadow-x78/orbiscreen/blob/main/docs/INSTALL.md) for detailed platform-specific instructions.
          generate_release_notes: true
          files: |
            orbiscreen-linux-x86_64.tar.gz
            orbiscreen-linux-x86_64.tar.gz.sha256
            orbiscreen_amd64.deb
            orbiscreen_amd64.deb.sha256
            orbiscreen_x86_64.rpm
            orbiscreen_x86_64.rpm.sha256
            orbiscreen-x86_64.AppImage.tar.gz
            orbiscreen-x86_64.AppImage.tar.gz.sha256
            orbiscreen-android-release.apk
            orbiscreen-android-release.apk.sha256
