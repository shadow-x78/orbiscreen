# ─────────────────────────────────────────────
# Orbiscreen - Release Workflow
# https://github.com/shadow-x78/orbiscreen
# ─────────────────────────────────────────────

name: Release Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify code integrity (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only: this job runs on untrusted refs (workflow_dispatch) and must never be
    # able to write to the repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Toolchain ──
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb1-dev libxrandr-dev \
            libevdev-dev libxkbcommon-dev libwayland-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # ── Lint ──
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # ── Build & Test ──
      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # ── Audit ──
      - name: Dependency & license audit
        run: |
          cargo install --locked cargo-deny
          cargo deny check

  release:
    name: Build & Package Release Artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Toolchain ──
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb1-dev libxrandr-dev \
            libevdev-dev libxkbcommon-dev libwayland-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            rpm imagemagick librsvg2-bin \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev

      # ── Build ──
      - name: Build release binaries
        run: |
          cargo build --release --workspace --locked

      - name: Package Linux tarball
        run: |
          # A PATH-only install still needs the web client, or the daemon cannot serve
          # the browser UI at all, so the bundle ships the same share/ tree the deb,
          # rpm and AppImage use rather than binaries alone.
          mkdir -p release-bundle/bin
          mkdir -p release-bundle/share/orbiscreen/client
          mkdir -p release-bundle/lib/systemd/user
          mkdir -p release-bundle/lib/udev/rules.d
          mkdir -p release-bundle/share/applications
          cp target/release/orbiscreen release-bundle/bin/
          if [ -f target/release/orbiscreen-gui ]; then
            cp target/release/orbiscreen-gui release-bundle/bin/
          fi
          for f in index.html style.css app.js annexb.js stats.js favicon.svg favicon.png apple-touch-icon.png; do
            install -m 644 "clients/web/$f" "release-bundle/share/orbiscreen/client/$f"
          done
          install -m 644 data/orbiscreen.service release-bundle/lib/systemd/user/orbiscreen.service
          install -m 644 data/99-orbiscreen-usb.rules release-bundle/lib/udev/rules.d/99-orbiscreen-usb.rules
          install -m 644 data/orbiscreen.desktop release-bundle/share/applications/orbiscreen.desktop
          cat > release-bundle/README.md <<'README'
          # Orbiscreen

          `bin/` holds the executables, `share/orbiscreen/client/` the web client the
          daemon serves at `/client`, and `lib/` the systemd user unit and the udev
          rules for USB/AOA access.

          The easiest route is still `scripts/install.sh` from the repository. To install
          by hand:

            install -Dm755 bin/orbiscreen ~/.local/bin/orbiscreen
            install -Dm755 bin/orbiscreen-gui ~/.local/bin/orbiscreen-gui
            install -Dm644 -t ~/.local/share/orbiscreen/client \
              share/orbiscreen/client/*
            install -Dm644 share/applications/orbiscreen.desktop \
              ~/.local/share/applications/orbiscreen.desktop
            install -Dm644 lib/systemd/user/orbiscreen.service \
              ~/.config/systemd/user/orbiscreen.service
            sudo install -Dm644 lib/udev/rules.d/99-orbiscreen-usb.rules \
              /usr/lib/udev/rules.d/99-orbiscreen-usb.rules
            systemctl --user daemon-reload && systemctl --user enable orbiscreen.service

          Full installation instructions, usage, and troubleshooting are at
          https://github.com/shadow-x78/orbiscreen
          README
          tar -czvf orbiscreen-linux-x86_64.tar.gz -C release-bundle .

      - name: Package Debian DEB package
        env:
          RPM_GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
          RPM_GPG_NAME: ${{ secrets.RPM_GPG_NAME }}
        run: |
          chmod +x scripts/package-deb.sh
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package-deb.sh "$VERSION"
          mv "orbiscreen_${VERSION}_amd64.deb" orbiscreen_amd64.deb

          if [ -z "$RPM_GPG_KEY" ] || [ -z "$RPM_GPG_NAME" ]; then
            echo "::error::RPM_GPG_KEY / RPM_GPG_NAME secrets are not set; cannot sign the DEB"
            exit 1
          fi
          echo "Signing DEB package..."
          sudo apt-get install -y debsigs gnupg2
          echo "$RPM_GPG_KEY" | gpg2 --import
          debsigs --sign=origin --default-key="$RPM_GPG_NAME" orbiscreen_amd64.deb

      - name: Package RPM package
        env:
          RPM_GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
          RPM_GPG_NAME: ${{ secrets.RPM_GPG_NAME }}
        run: |
          chmod +x scripts/package-rpm.sh
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package-rpm.sh "$VERSION"
          mv "orbiscreen-${VERSION}-1.x86_64.rpm" orbiscreen_x86_64.rpm

          if [ -z "$RPM_GPG_KEY" ] || [ -z "$RPM_GPG_NAME" ]; then
            echo "::error::RPM_GPG_KEY / RPM_GPG_NAME secrets are not set; cannot sign the RPM"
            exit 1
          fi
          echo "Signing RPM package..."
          sudo apt-get install -y rpm gnupg2
          echo "$RPM_GPG_KEY" | gpg2 --import
          echo "%_gpg_name $RPM_GPG_NAME" >> ~/.rpmmacros
          rpmsign --addsign orbiscreen_x86_64.rpm

      - name: Package AppImage
        run: |
          chmod +x scripts/package-appimage.sh
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package-appimage.sh "$VERSION"
          cp "dist/orbiscreen-${VERSION}-x86_64.AppImage" orbiscreen-x86_64.AppImage

      - name: Set up JDK 17 for Android
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build Android Release APK
        env:
          ORBISCREEN_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ORBISCREEN_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORBISCREEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBISCREEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd clients/android
          if [ -z "${ORBISCREEN_KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is not set in the repository"
            exit 1
          fi
          umask 077
          echo "$ORBISCREEN_KEYSTORE_B64" | base64 -d > /tmp/orbiscreen-release.keystore
          export ORBISCREEN_KEYSTORE_PATH=/tmp/orbiscreen-release.keystore
          chmod +x gradlew
          ./gradlew assembleRelease
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "::error::APK came out unsigned - signing secrets are incomplete"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../../orbiscreen-android-release.apk

      - name: Remove Android keystore
        if: always()
        run: rm -f /tmp/orbiscreen-release.keystore

      - name: Generate SHA256 sums
        run: |
          sha256sum orbiscreen-linux-x86_64.tar.gz > orbiscreen-linux-x86_64.tar.gz.sha256
          sha256sum orbiscreen_amd64.deb > orbiscreen_amd64.deb.sha256
          sha256sum orbiscreen_x86_64.rpm > orbiscreen_x86_64.rpm.sha256
          sha256sum orbiscreen-x86_64.AppImage > orbiscreen-x86_64.AppImage.sha256
          sha256sum orbiscreen-android-release.apk > orbiscreen-android-release.apk.sha256

      - name: Extract Release Notes
        id: extract_notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="v$VERSION" '
            flag && /^## \[/ { flag = 0 }
            !flag && index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag { print }
          ' CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "release_notes.txt is empty - no CHANGELOG entry found for v$VERSION; using fallback notes"
            printf 'Orbiscreen %s\n\nSee https://github.com/shadow-x78/orbiscreen/blob/main/CHANGELOG.md for details.\n' "v$VERSION" > release_notes.txt
          fi
          cat release_notes.txt

      - name: Generate GitHub Build Attestations
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            orbiscreen-linux-x86_64.tar.gz
            orbiscreen_amd64.deb
            orbiscreen_x86_64.rpm
            orbiscreen-*.AppImage
            orbiscreen-android-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating GitHub Release for $TAG..."
            gh release create "$TAG" \
              --title "Orbiscreen $TAG" \
              --notes-file release_notes.txt
          else
            echo "GitHub Release $TAG exists; updating metadata..."
            gh release edit "$TAG" \
              --title "Orbiscreen $TAG" \
              --notes-file release_notes.txt
          fi

          echo "Uploading release assets..."
          RELEASE_ASSETS=(
            "orbiscreen-linux-x86_64.tar.gz"
            "orbiscreen-linux-x86_64.tar.gz.sha256"
            "orbiscreen_amd64.deb"
            "orbiscreen_amd64.deb.sha256"
            "orbiscreen_x86_64.rpm"
            "orbiscreen_x86_64.rpm.sha256"
            "orbiscreen-x86_64.AppImage"
            "orbiscreen-x86_64.AppImage.sha256"
            "orbiscreen-android-release.apk"
            "orbiscreen-android-release.apk.sha256"
          )

          for asset in "${RELEASE_ASSETS[@]}"; do
            echo "Uploading $asset..."
            success=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$asset" --clobber; then
                echo "Successfully uploaded $asset"
                success=true
                break
              fi
              echo "Upload of $asset failed (attempt $attempt/3). Retrying in 5s..."
              sleep 5
            done
            if [ "$success" != "true" ]; then
              echo "::error::Failed to upload $asset after 3 attempts"
              exit 1
            fi
          done


